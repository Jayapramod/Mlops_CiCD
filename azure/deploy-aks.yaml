apiVersion: v1
kind: Namespace
metadata:
  name: agrox
  labels:
    name: agrox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrox-app
  namespace: agrox
  labels:
    app: agrox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agrox
  template:
    metadata:
      labels:
        app: agrox
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: agrox-app
        image: agrodecmacrdev.azurecr.io/agrox:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agrox-service
  namespace: agrox
  labels:
    app: agrox
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: agrox
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agrox-hpa
  namespace: agrox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agrox-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
